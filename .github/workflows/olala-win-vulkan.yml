name: olala-win-vulkan
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Headers, SPIRV-Tools, Glslang, Shader-C
          vulkan-use-cache: true

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_VULKAN=ON
          -DGGML_NATIVE=OFF
          -DGGML_OPENMP=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_OPENSSL=OFF
          -DLLAMA_USE_PREBUILT_UI=OFF
          -DBUILD_UI=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build -j 4 --target llama-server llama-cli

      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item -Path build/bin/* -Destination dist/ -Recurse -Force
          $sys = "$env:SystemRoot\System32"
          foreach ($d in @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","vcomp140.dll")) {
            if (Test-Path "$sys\$d") { Copy-Item "$sys\$d" dist/ -Force }
          }
          Compress-Archive -Path dist/* -DestinationPath olala-llama-win-vulkan.zip

      - uses: actions/upload-artifact@v4
        with:
          name: olala-llama-win-vulkan
          path: olala-llama-win-vulkan.zip
