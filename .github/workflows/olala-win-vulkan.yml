name: olala-win-vulkan
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Vulkan SDK
        uses: Microsoft/setup-vulkan@v2
        id: vksdk

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_VULKAN=ON
          -DGGML_NATIVE=OFF
          -DGGML_OPENMP=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_OPENSSL=OFF
          -DLLAMA_USE_PREBUILT_UI=OFF
          -DBUILD_UI=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build -j 4 --target llama-server llama-cli

      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item -Path build/bin/* -Destination dist/ -Recurse -Force
          $vc = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Copy-Item "$($vc.FullName)\x64\Microsoft.VC*.CRT\*.dll" dist/ -Force
          Compress-Archive -Path dist/* -DestinationPath olala-llama-win-vulkan.zip

      - uses: actions/upload-artifact@v4
        with:
          name: olala-llama-win-vulkan
          path: olala-llama-win-vulkan.zip
