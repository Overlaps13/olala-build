name: olala-win-cuda
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup CUDA 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: '86'

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=ON
          -DCMAKE_CUDA_ARCHITECTURES=86
          -DCMAKE_CUDA_FLAGS=--allow-unsupported-compiler
          -DGGML_NATIVE=OFF
          -DGGML_OPENMP=OFF
          -DLLAMA_CURL=OFF
          -DLLAMA_OPENSSL=OFF
          -DLLAMA_USE_PREBUILT_UI=OFF
          -DLLAMA_BUILD_UI=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build -j 4 --target llama-server llama-cli

      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item -Path build/bin/* -Destination dist/ -Recurse -Force
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin"
          $vc = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Copy-Item "$($vc.FullName)\x64\Microsoft.VC*.CRT\*.dll" dist/ -Force
          Copy-Item "$cuda\cudart64_12.dll" dist/ -Force
          Copy-Item "$cuda\cublas64_12.dll" dist/ -Force
          Copy-Item "$cuda\cublasLt64_12.dll" dist/ -Force
          Get-ChildItem dist | Select-Object Name, Length | Format-Table
          Compress-Archive -Path dist/* -DestinationPath olala-llama-win-cuda.zip

      - uses: actions/upload-artifact@v4
        with:
          name: olala-llama-win-cuda
          path: olala-llama-win-cuda.zip

# registered on default branch
